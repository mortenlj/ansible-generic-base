---
- name: Linux packages
  include_tasks: packages_linux.yml
  when: ansible_facts['system'] == 'Linux'
- name: MacOS packages
  include_tasks: packages_macos.yml
  when: ansible_facts['system'] == 'Darwin'
- name: Set editor
  lineinfile:
    path: /etc/profile
    line: "export EDITOR=${EDITOR:-{{ lookup('pipe', 'which micro') }}}"
    regexp: "export EDITOR=.*"
    insertafter: "export PAGER=.*"
    create: yes
    owner: root
    group: "{{ generic_base_system_group }}"
    mode: u=rw,g=r,o=r
- name: Check if we need to create profile directory
  stat:
    path: /etc/profile.d/
  register: profile_d
  changed_when: False
- name: Create bash profile directory
  file:
    path: /etc/profile.d/
    state: directory
    owner: root
    group: "{{ generic_base_system_group }}"
    mode: u=rwx,g=rx,o=rx
  when: not (profile_d.stat.isdir | default(false))
- name: Load bash profile scripts
  blockinfile:
    path: /etc/profile
    create: yes
    owner: root
    group: "{{ generic_base_system_group }}"
    mode: u=rw,g=r,o=r
    block: |
      for sh in /etc/profile.d/*.sh ; do
        [ -r "$sh" ] && . "$sh"
      done
      unset sh
  when: not (profile_d.stat.isdir | default(false))
- name: Add common aliases
  copy:
    src: bash-aliases.sh
    dest: /etc/profile.d/aliases.sh
    owner: root
    group: "{{ generic_base_system_group }}"
    mode: u=rw,g=r,o=r
- name: Add fancy prompt
  copy:
    src: bash-prompt.sh
    dest: /etc/profile.d/prompt.sh
    owner: root
    group: "{{ generic_base_system_group }}"
    mode: u=rw,g=r,o=r
- name: Configure timezone
  community.general.timezone:
    name: Europe/Oslo
- name: Linux shell config
  include_tasks: shell_linux.yml
  when: ansible_facts['system'] == 'Linux'
- name: Linux locales
  include_tasks: locale_linux.yml
  when: ansible_facts['system'] == 'Linux'
- name: Linux journald config
  include_tasks: journald_linux.yml
  when: ansible_facts['system'] == 'Linux'
- name: DMA tasks
  include_tasks: dma_linux.yml
  when: ansible_facts['system'] == 'Linux'
- name: Dirty Frag mitigation
  include_tasks: dirty_frag_linux.yml
  when: ansible_facts['system'] == 'Linux'

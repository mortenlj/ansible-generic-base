---
- name: Enable locales
  community.general.locale_gen:
    name: "{{ item }}"
  loop:
    - nb_NO.UTF-8
    - en_US.UTF-8
  notify:
    - Update locale
- name: Configure locales
  ansible.builtin.copy:
    src: locale
    dest: /etc/locale.conf
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  notify:
    - Update locale

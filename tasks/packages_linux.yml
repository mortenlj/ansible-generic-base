---
- name: Install some basic apps
  package:
    name:
      - apt-utils
      - bash
      - bash-completion
      - gpg
      - gpg-agent
      - coreutils
      - nano
      - micro
      - exuberant-ctags
      - tcpdump
      - htop
      - wget
      - curl
      - px
      - less
      - net-tools
      - python3-pygments
      - plocate
      - ncurses-base
      - kitty-terminfo
      - bind9-dnsutils
      - file
      - tree
      - sysstat
      - tzdata
      - util-linux
      - util-linux-locales
      - util-linux-extra
      - du-dust
      - duf
      - starship
- name: Install nala if available
  package:
    name:
      - nala
  when: ansible_facts['distribution'] == 'Ubuntu' or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_release'] != 'bullseye')
- name: Install eza if available
  package:
    name:
      - eza
  when: ansible_facts['distribution'] == 'Ubuntu' or (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_release'] not in ('bookworm', 'bullseye'))
- name: Install exa if eza not available
  package:
    name:
      - exa
  when: ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_release'] in ('bookworm', 'bullseye')
